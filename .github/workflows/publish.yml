name: publish

# Triggered by repository_dispatch from the factory's release.yml workflow
# (definancy/definancy-sdks). The factory pushes factory-vX.Y.Z, then
# dispatches a `publish-release` event to this repo with version + sha
# in client_payload. This workflow checks out at the SHA, verifies the
# pom version matches, deploys to GitHub Packages, and creates a GitHub
# Release for vX.Y.Z.
#
# Security: client_payload values are passed via env vars (not inlined into
# run: scripts) to avoid shell injection via maliciously-crafted dispatches.

on:
  repository_dispatch:
    types: [publish-release]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish v${{ github.event.client_payload.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify pom version matches dispatch
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          pom_v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$pom_v" != "$VERSION" ]; then
            echo "::error::pom.xml version '$pom_v' does not match dispatch version '$VERSION'"
            exit 1
          fi

      - name: Deploy to GitHub Packages
        env:
          VERSION: ${{ github.event.client_payload.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(mvn -B deploy -DskipTests 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -qE '409|Conflict|already exists|reason phrase: Conflict'; then
              echo "::warning::version $VERSION already exists in registry — skipping (idempotent retry)"
              exit 0
            fi
            exit $rc
          fi

      - name: Extract CHANGELOG section for VERSION
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          echo "wrote release-notes.md ($(wc -l < release-notes.md) lines)"

      - name: Collect release artifacts
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          mkdir -p release-artifacts
          # Primary jar + classified variants from core (mvn deploy already
          # built them; we just collect them for the GitHub Release page).
          # `|| true` on each individual cp lets the step succeed even if
          # one classifier isn't produced (e.g., shaded plugin disabled).
          for f in \
            "core/target/definancy-sdk-java-core-${VERSION}.jar" \
            "core/target/definancy-sdk-java-core-${VERSION}-shaded.jar" \
            "core/target/definancy-sdk-java-core-${VERSION}-sources.jar" \
            "core/target/definancy-sdk-java-core-${VERSION}-javadoc.jar" \
            "demos/target/definancy-sdk-java-demos-${VERSION}.jar"; do
            if [ -f "$f" ]; then
              cp "$f" release-artifacts/
              echo "  attached: $(basename "$f")"
            else
              echo "  missing (skipped): $(basename "$f")"
            fi
          done
          ls -la release-artifacts/

      - name: Create GitHub Release
        env:
          VERSION: ${{ github.event.client_payload.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            release-artifacts/*
