    BlockchainTransactionId:
      description: "Unique blockchain transaction hash or identifier as recorded on\
        \ the \nblockchain network. Used to track and verify transactions on the network.\
        \ \nThis hash serves as the definitive reference for locating transactions\
        \ \nin blockchain explorers and verification systems."
      type: string
    BlockchainTransactionStatus:
      description: |-
        Current confirmation status of a blockchain transaction indicating
        its processing state from initial detection through final confirmation.
      enum:
      - compliance
      - waiting
      - confirming
      - confirmed
      type: string
    BlockchainConfirmations:
      description: |-
        Number of blockchain confirmations observed for a transaction, indicating
        the level of network consensus and security. Higher numbers provide
        greater confidence in transaction finality.
      maximum: 65535
      minimum: 0
      type: integer
    BlockchainConfirmationStats:
      description: |-
        Confirmation progress information for transactions in the confirming state,
        providing current status and estimated completion time for full confirmation.
      properties:
        confirmed:
          allOf:
          - $ref: "#/components/schemas/BlockchainConfirmations"
          description: Number of confirmations currently observed for this transaction.
        remaining:
          allOf:
          - $ref: "#/components/schemas/BlockchainConfirmations"
          description: Number of additional confirmations needed to reach required
            threshold.
        eta:
          allOf:
          - $ref: "#/components/schemas/Timestamp"
          description: |-
            Estimated timestamp when the transaction will reach full confirmation
            based on network block time averages.
      required:
      - confirmed
      - eta
      - remaining
    BlockchainTransaction:
      description: |-
        Complete blockchain transaction record including addresses, amounts,
        timestamps, and confirmation status for comprehensive payment tracking
        and verification throughout the transaction lifecycle.
      example:
        amount: ""
        confirmation-stats: ""
        receiver: ""
        sender: ""
        id: ""
        ts: ""
        status: ""
      properties:
        id:
          allOf:
          - $ref: "#/components/schemas/BlockchainTransactionId"
          description: Unique blockchain transaction identifier or hash.
        ts:
          allOf:
          - $ref: "#/components/schemas/Timestamp"
          description: Timestamp when transaction was first detected or confirmed.
        sender:
          allOf:
          - $ref: "#/components/schemas/NetworkAddress"
          description: Blockchain address that sent the funds for this transaction.
        receiver:
          allOf:
          - $ref: "#/components/schemas/NetworkAddress"
          description: Blockchain address that received the funds from this transaction.
        amount:
          allOf:
          - $ref: "#/components/schemas/ContractAmount"
          description: Precise amount transferred in this transaction with contract
            context.
        status:
          allOf:
          - $ref: "#/components/schemas/BlockchainTransactionStatus"
          description: Current confirmation and processing status of this transaction.
        confirmation-stats:
          allOf:
          - $ref: "#/components/schemas/BlockchainConfirmationStats"
          description: Detailed confirmation progress and timing information.
      required:
      - amount
      - confirmation-stats
      - id
      - receiver
      - sender
      - status
      - ts
    VelocityMode:
      description: |-
        Behavior when a velocity limit is exceeded. `reject` blocks the payment with
        a 400 BIZ-010 error; `warn` allows it but emits a warning in the response.
      enum:
      - reject
      - warn
      type: string
    VelocityScope:
      description: Hierarchy level at which a velocity limit applies (or was evaluated).
      enum:
      - account
      - vault
      type: string
    VelocityLimitFormat:
      description: |-
        Velocity limit configuration. The unique key per scope is `windowMinutes`.
        Set `windowMinutes` to 0 for "single payment cap" — no time aggregation;
        the check compares the requested amount alone against the limit.
        The limit's `amount` may be denominated in any contract; at check time it
        is converted to the account's velocity reference contract via a market quote.
      example:
        mode: reject
        amount: ""
        window-minutes: 0
      properties:
        window-minutes:
          description: Rolling window length in minutes. 0 means single payment cap.
          minimum: 0
          type: integer
        amount:
          allOf:
          - $ref: "#/components/schemas/ContractAmountFormat"
          description: "Limit amount, denominated in any contract."
        mode:
          $ref: "#/components/schemas/VelocityMode"
      required:
      - amount
      - mode
      - window-minutes
    VelocityWarning:
      description: |-
        Emitted in the response of estimate/create endpoints when a warn-mode
        velocity limit is exceeded but the request was still allowed to proceed.
      example:
        window-minutes: 0
        scope: account
        limit: ""
        used: ""
      properties:
        scope:
          $ref: "#/components/schemas/VelocityScope"
        window-minutes:
          minimum: 0
          type: integer
        limit:
          allOf:
          - $ref: "#/components/schemas/ContractAmount"
          description: The configured limit (in its original contract).
        used:
          allOf:
          - $ref: "#/components/schemas/Amount"
          description: "Total exposure used so far, normalized to the account reference\
            \ contract."
      required:
      - limit
      - scope
      - used
      - window-minutes
  securitySchemes:
    dpop-auth:
      description: |-
        **DPoP-bound Token.**
        A token bound to a public key and the current request.
        Must be prefixed with `DPoP ` (e.g., `Authorization: DPoP eyJhbGciOiJ...`).
        **When using this format, the `DPoP` header is ALSO REQUIRED as proof.**
      in: header
      name: Authorization
      type: apiKey
    dpop-proof:
      description: |-
        **Demonstrating Proof-of-Possession (DPoP) Token.**
        **Required only when the `Authorization` header uses the `DPoP` prefix.**
        A signed JWT that proves the client holds the private key associated with the public key
        bound to the access token. It protects against token replay and is cryptographically
        bound to the specific HTTP method and URL of this request.
      in: header
      name: DPoP
      type: apiKey

