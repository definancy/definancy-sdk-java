  /v1/auth/{definancyId}:
    put:
      description: |-
        Registers a **Definancy ID**.

        This operation does not create a new Definancy ID from scratch but formally registers the
        Definancy method-specific identifier on the network, enabling it to be resolved and used for
        verifiable credentials and interactions.
      operationId: RegisterAuth
      parameters:
      - description: |-
          The Definancy Identifier. This is a base32-encoded (without padding) string derived from an ED25519 public key.
          The identifier is generated by:
          1. Taking the 32-byte public key
          2. Computing a SHA512/256 hash (32 bytes) of the public key
          3. Taking the last 4 bytes of this hash as a checksum
          4. Appending the checksum to the public key (creating a 36-byte value)
          5. Encoding the combined value using base32 without padding
        explode: false
        in: path
        name: definancyId
        required: true
        schema:
          example: ZKKXG4KA5PTZ526QA4URHSNOTYGHDON2GGTS3L6GCVDN6QUVIZNIMZ7K64
          pattern: "^[A-Z2-7]{58}$"
          type: string
        style: simple
      responses:
        "200":
          description: "**Success.** The Definancy ID `{definancyId}` was successfully\
            \ registered."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorList"
          description: |-
            The request contains malformed data, invalid parameters, or violates API constraints.
            This includes validation errors, incorrect data types, missing required fields,
            or values outside acceptable ranges. Check the error details for specific issues.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorList"
          description: |-
            Authentication credentials are missing, invalid, or expired. The request lacks
            proper authorization headers or tokens. Clients should verify their authentication
            setup and ensure valid credentials are provided in subsequent requests.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorList"
          description: |-
            The authenticated user lacks sufficient permissions to perform this operation.
            While authentication was successful, the user's role or access level does not
            permit the requested action. Contact an administrator for access rights.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorList"
          description: |-
            The request could not be completed because the target resource already exists.
            This typically occurs when attempting to create a resource that duplicates an
            existing one, such as a duplicate identifier or a resource that violates
            uniqueness constraints.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorList"
          description: |-
            An unexpected server error occurred while processing the request. This indicates
            an internal system issue that prevented successful completion. The error details
            may provide additional context for debugging and support purposes.
      summary: Register a Definancy ID
      tags:
      - Auth
      x-accepts:
      - application/json
