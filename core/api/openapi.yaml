openapi: 3.1.0
info:
  contact:
    email: support@definancy.com
    name: Definancy
    url: https://definancy.com
  description: |-
    REST API for managing asset, network and contract configurations, and vault-based financial operations.
    This API provides a comprehensive set of endpoints for health monitoring, network management, asset
    configuration, contract management, vault lifecycle management, and QR-Code generation. It is designed
    to facilitate seamless integration with financial systems, ensuring secure and efficient payment
    processing while maintaining strict compliance standards.
  title: Definancy API
  version: 0.1.0
servers:
- description: Stub - Authentication is disabled
  url: https://stub.definancy.com
- description: Development
  url: https://dev.definancy.com
security:
- dpop-auth: []
  dpop-proof: []
tags:
- description: |-
    Experimental endpoints to help in client development.
    **These endpoints are only available in DEV environments**
  name: Experimental
- description: "Health monitoring endpoints for verifying service availability and\
    \ operational status.\nThese endpoints allow you to check if the service is alive\
    \ and ready to accept traffic, \nensuring that your applications can rely on the\
    \ Definancy service for their operations."
  name: Probe
- description: |-
    Authentication endpoints for managing authentication and authorization.
    These endpoints allow you to authenticate and authorize users to access the Definancy service.
  name: Auth
- description: |-
    Network configuration and status management.
    This section includes endpoints for retrieving and managing network configurations, which
    are essential for setting up and maintaining networks for payment processing.
  name: Network
- description: |-
    Asset configuration and status management.
    These endpoints allow you to manage digital assets, including retrieving and updating
    asset configurations, which is crucial for handling various cryptocurrencies and tokens
    in payment operations.
  name: Asset
- description: |-
    Contract configuration and status management.
    This section provides endpoints for managing contracts, including retrieving and
    updating contract configurations, which is vital for executing and validating payments
    on networks.
  name: Contract
- description: |-
    Vault lifecycle management and configuration.
    These endpoints enable you to manage vaults, which are containers for payment acceptance,
    documents, and contract subscriptions. Vaults are essential for organizing and processing
    payments while maintaining compliance.
  name: Vault
- description: |-
    Management of vault contract associations within vaults.
    This section includes endpoints for subscribing and unsubscribing contracts to vaults,
    allowing you to control which contracts are active in specific vaults for payment processing.
  name: Vault - Contract Subscription
- description: |-
    Documents management within vaults.
    These endpoints allow you to submit, retrieve, and archive documents related to payment
    acceptance, ensuring that all necessary compliance documents are managed efficiently.
  name: Vault - Document
- description: |-
    Payment processing and transaction management for vault-based financial operations.
    These endpoints enable you to estimate, create, retrieve, update, and archive payments,
    which are essential for executing payments and tracking their status.
  name: Vault - Payment
- description: |-
    Velocity limit configuration and enforcement for payment operations.
    Velocity limits cap how much can be paid within a rolling time window
    (per account or per vault). Setting `windowMinutes` to 0 means
    "single-payment cap" — no time aggregation.
  name: Velocity
- description: |-
    QR-Code generator.
    This section includes endpoints for generating QR codes, which are used for facilitating
    blockchain transactions by encoding payment instructions that can be scanned by cryptocurrency
    wallets.
  name: QR-Code
paths:
  /v1/healthy:
    get:
      description: "Verifies service liveness. Returns OK when operational.\nThis\
        \ endpoint is used to check if the service is alive and ready to handle requests,\
        \ \nensuring that your applications can rely on the Definancy service for\
        \ their operations."
      operationId: HealthyCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        default:
          $ref: "#/components/responses/DefaultResponse"
      security: []
      summary: Health Check
      tags:
      - Probe
      x-accepts:
      - application/json
  /v1/ready:
    get:
      description: |-
        Verifies service readiness. Returns OK when ready to accept traffic.
        This endpoint checks if the service is ready to handle incoming requests, ensuring
        that your applications can rely on the Definancy service for their operations.
      operationId: ReadyCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        default:
          $ref: "#/components/responses/DefaultResponse"
      security: []
      summary: Ready Check
      tags:
      - Probe
      x-accepts:
      - application/json
  /v1/auth/{definancyId}:
    put:
      description: |-
        Registers a **Definancy ID**.

        This operation does not create a new Definancy ID from scratch but formally registers the
        Definancy method-specific identifier on the network, enabling it to be resolved and used for
        verifiable credentials and interactions.
      operationId: RegisterAuth
      parameters:
      - description: |-
          The Definancy Identifier. This is a base32-encoded (without padding) string derived from an ED25519 public key.
          The identifier is generated by:
          1. Taking the 32-byte public key
          2. Computing a SHA512/256 hash (32 bytes) of the public key
          3. Taking the last 4 bytes of this hash as a checksum
          4. Appending the checksum to the public key (creating a 36-byte value)
          5. Encoding the combined value using base32 without padding
        explode: false
        in: path
        name: definancyId
        required: true
        schema:
          pattern: "^[A-Z2-7]{58}$"
          type: string
        style: simple
      responses:
        "200":
          description: "**Success.** The Definancy ID `{definancyId}` was successfully\
            \ registered."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          $ref: "#/components/responses/InvalidRequestResponse"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Register a Definancy ID
      tags:
      - Auth
      x-accepts:
      - application/json
  /v1/network:
    get:
      description: "Retrieves all configured networks.\nThis endpoint returns a list\
        \ of all configured networks, which are essential for \nsetting up and maintaining\
        \ networks for payment processing."
      operationId: GetNetworks
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Network"
                type: array
          description: Successful retrieval of network configurations.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: List Networks
      tags:
      - Network
      x-accepts:
      - application/json
  /v1/network/{networkId}:
    get:
      description: "Retrieves configuration details for a specific network.\nThis\
        \ endpoint returns detailed configuration information for a specific\nnetwork,\
        \ which is essential for managing and maintaining networks for \npayment processing."
      operationId: GetNetwork
      parameters:
      - $ref: "#/components/parameters/NetworkIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
          description: Network details retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Get Network
      tags:
      - Network
      x-accepts:
      - application/json
    patch:
      description: "Updates configuration parameters for a network.\nThis endpoint\
        \ allows you to update configuration parameters for a specific\nnetwork, which\
        \ is essential for managing and maintaining networks for \npayment processing."
      operationId: ConfigNetwork
      parameters:
      - $ref: "#/components/parameters/NetworkIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkConfig"
        description: "Network configuration parameters to update. Currently supports\
          \ only the 'enabled' \nfield for controlling network availability. When\
          \ setting 'enabled' to false, the \nnetwork will be disabled for payment\
          \ processing while preserving all existing \ncontracts and historical transaction\
          \ data."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
          description: Network configuration updated successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          $ref: "#/components/responses/InvalidRequestResponse"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Configure Network
      tags:
      - Network
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/network/{networkId}/native:
    get:
      description: "Retrieves the native asset of a specific network in a form of\
        \ a contract.\nThis endpoint returns the native asset of a specific network\
        \ in the form of a contract, \nwhich is essential for understanding and managing\
        \ the native token of a network."
      operationId: GetNetworkNativeAsset
      parameters:
      - $ref: "#/components/parameters/NetworkIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
          description: The contract with the network's native asset details is retrieved
            successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Get Network Native Asset
      tags:
      - Network
      x-accepts:
      - application/json
  /v1/network/{networkId}/explorer:
    get:
      description: |-
        Returns URL templates for the network's block explorer.
        Templates use {value} as a placeholder for the address or transaction ID.
      operationId: GetNetworkExplorer
      parameters:
      - $ref: "#/components/parameters/NetworkIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkExplorer"
          description: Explorer URL templates retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      security: []
      summary: Get Network Explorer
      tags:
      - Network
      x-accepts:
      - application/json
  /v1/asset:
    get:
      description: |-
        Retrieves all configured digital assets.
        This endpoint returns a list of all configured digital assets, which are essential
        for handling various assets in payment operations.
      operationId: GetAssets
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Asset"
                type: array
          description: Asset list retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: List Assets
      tags:
      - Asset
      x-accepts:
      - application/json
  /v1/asset/{assetUnit}:
    get:
      description: |-
        Retrieves configuration details for a specific digital asset.
        This endpoint returns detailed configuration information for a specific digital asset,
        which is essential for managing and handling various assets in payment operations.
      operationId: GetAsset
      parameters:
      - $ref: "#/components/parameters/AssetUnitParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
          description: Asset details retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Get Asset
      tags:
      - Asset
      x-accepts:
      - application/json
    patch:
      description: "Updates configuration parameters for a digital asset.\nThis endpoint\
        \ allows you to update configuration parameters for a specific digital asset,\
        \ \nwhich is essential for managing and handling various assets in payment\
        \ operations."
      operationId: ConfigAsset
      parameters:
      - $ref: "#/components/parameters/AssetUnitParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetConfig"
        description: "Asset configuration parameters to update. Currently supports\
          \ only the 'enabled' \nfield for controlling asset availability. When setting\
          \ 'enabled' to false, the \nasset will be disabled for payment processing\
          \ while preserving all existing \ncontracts and historical transaction data."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
          description: Asset configuration updated successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          $ref: "#/components/responses/InvalidRequestResponse"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Configure Asset
      tags:
      - Asset
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/contract:
    get:
      description: |-
        Retrieves all contract configurations.
        This endpoint returns a list of all configured contracts, which are essential
        for executing and validating payments on networks.
      operationId: GetContracts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Contract"
                type: array
          description: Contract list retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: List Contracts
      tags:
      - Contract
      x-accepts:
      - application/json
  /v1/contract/{assetUnit}/{networkId}:
    get:
      description: |-
        Retrieves configuration details for a specific smart contract.
        This endpoint returns detailed configuration information for a specific contract,
        which is essential for executing and validating payments on networks.
      operationId: GetContract
      parameters:
      - $ref: "#/components/parameters/AssetUnitParam"
      - $ref: "#/components/parameters/NetworkIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
          description: Contract information retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Get Contract
      tags:
      - Contract
      x-accepts:
      - application/json
    patch:
      description: |-
        Updates configuration parameters for a contract.
        This endpoint allows you to update configuration parameters for a specific contract,
        which is essential for executing and validating payments on networks.
      operationId: ConfigContract
      parameters:
      - $ref: "#/components/parameters/AssetUnitParam"
      - $ref: "#/components/parameters/NetworkIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractConfig"
        description: "Contract configuration parameters to update. Currently supports\
          \ only the 'enabled' \nfield for controlling contract availability. When\
          \ setting 'enabled' to false, the \ncontract will be disabled for payment\
          \ processing while preserving all existing \nvault associations, payment\
          \ acceptance, and historical transaction data."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
          description: Contract configuration updated successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          $ref: "#/components/responses/InvalidRequestResponse"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Configure Contract
      tags:
      - Contract
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/vault:
    get:
      description: |-
        Retrieves all vault configurations.
        This endpoint returns a list of all vault configurations, which are essential for
        organizing and processing payments while maintaining compliance.
      operationId: GetVaults
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Vault"
                type: array
          description: Vault list retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: List Vaults
      tags:
      - Vault
      x-accepts:
      - application/json
  /v1/vault/{vaultId}:
    delete:
      description: Deactivates a vault while preserving historical data.
      operationId: ArchiveVault
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
          description: Vault archived successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Archive Vault
      tags:
      - Vault
      x-accepts:
      - application/json
    get:
      description: |-
        Retrieves configuration details for a specific vault.
        This endpoint returns detailed configuration information for a specific vault,
        which is essential for organizing and processing payments while maintaining compliance.
      operationId: GetVault
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
          description: Vault details retrieved successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Get Vault
      tags:
      - Vault
      x-accepts:
      - application/json
    patch:
      description: "Updates specific fields of an existing vault configuration. \n\
        Only provided properties will be modified.\nReturns the updated vault configuration."
      operationId: ConfigVault
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultConfig"
        description: |-
          Partial vault configuration containing only the fields to be updated. The 'contract-ids'
          list can be used to modify vault subscriptions by adding or removing contract associations.
          The 'enabled' field can be used to activate or deactivate the vault for new operations.
          Only the provided fields will be modified, preserving all other existing configuration
          settings.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
          description: Vault configuration partially updated successfully
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          $ref: "#/components/responses/InvalidRequestResponse"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Partially Update Vault Configuration
      tags:
      - Vault
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: "Updates or creates the configuration for a vault with {vaultId}.\
        \ This operation \nwill fully replace the existing configuration if the vault\
        \ exists, or create\na new vault if it does not."
      operationId: SetVault
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultConfig"
        description: "Vault configuration with the fields to be updated with non-default\
          \ values. All \nnon-specified fields will be set with the default values.\
          \ The 'contract-ids' \nlist can be used to add or remove contract subscriptions.\
          \ The 'enabled' field \ncan be used to activate or deactivate the vault."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
          description: Vault configuration updated successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "400":
          $ref: "#/components/responses/InvalidRequestResponse"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Create or Update Vault
      tags:
      - Vault
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/vault/{vaultId}/contract/{assetUnit}/{networkId}:
    delete:
      description: Removes association between a contract and vault.
      operationId: VaultUnsubscribeContract
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      - $ref: "#/components/parameters/AssetUnitParam"
      - $ref: "#/components/parameters/NetworkIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
          description: Contract successfully unsubscribed from vault.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Unsubscribe Contract from Vault
      tags:
      - Vault - Contract Subscription
      x-accepts:
      - application/json
    put:
      description: Associates a smart contract with a vault.
      operationId: VaultSubscribeContract
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      - $ref: "#/components/parameters/AssetUnitParam"
      - $ref: "#/components/parameters/NetworkIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
          description: Contract successfully subscribed to vault.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlHeader"
        "401":
          $ref: "#/components/responses/MissingAuthorizationResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/DefaultResponse"
      summary: Subscribe Contract to Vault
      tags:
      - Vault - Contract Subscription
      x-accepts:
      - application/json
  /v1/vault/{vaultId}/payment/estimate:
    post:
      description: |-
        Calculates payment scenarios for specified contracts and amounts.
        Requires at least one contract-amount pair in the request body.
      operationId: VaultGetPaymentEstimate
      parameters:
      - $ref: "#/components/parameters/VaultIdParam"
      requestBody:
        content:
          application/json:
