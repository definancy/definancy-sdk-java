          allOf:
          - $ref: "#/components/schemas/PersonLegalIdType"
          description: Type of business identification document or registration.
        issuer:
          allOf:
          - $ref: "#/components/schemas/PersonLegalIdIssuer"
          description: Government authority or agency that issued the business registration.
      required:
      - issuer
      - number
      - type
    PersonLegalIdNumber:
      description: "Official business registration number, tax identification number,\
        \ or \nother government-issued entity identifier exactly as it appears on\
        \ \nofficial documentation."
      maxLength: 120
      minLength: 1
      type: string
    PersonLegalIdType:
      description: "Type of business identification document accepted for legal entity\
        \ \nverification. Currently limited to tax identification documents \nbut\
        \ may be expanded to include other business registration types."
