        version:
          $ref: "#/components/schemas/Version"
      required:
      - address
      - media
      - minor-unit
      - status
      - traits
      - vaults
      - version
    ContractConfig:
      description: |-
        Configuration parameters that control contract behavior and availability.
        Currently supports enabling/disabling the contract for new operations
        while preserving existing vault subscriptions and historical data.
      example:
        enabled: true
      properties:
        enabled:
          description: |-
            Boolean flag indicating whether a resource is active and operational.
            When true, the resource can be used for new operations. When false,
            the resource is disabled but historical data is preserved.
          type: boolean
    Contract:
      description: |-
        Complete contract definition combining identification, metadata,
        and configuration. Represents a deployed contract that can process
        payments for a specific asset on a specific blockchain network.
      example:
        id:
          asset-unit: asset-unit
          network-id: network-id
        config:
          enabled: true
        info:
          note: note
          address: address
          traits:
            payment-acceptance-pay-trait:
              max-amount:
                decimals: ""
                raw: ""
                value: ""
              min-amount:
                decimals: ""
                raw: ""
                value: ""
            payment-acceptance-price-trait:
              max-amount:
                decimals: ""
                raw: ""
                value: ""
              min-amount:
                decimals: ""
                raw: ""
                value: ""
          vaults:
          - null
          - null
          minor-unit:
            decimals: ""
            raw: ""
            value: ""
          media:
            logo-light:
              metadata: "{}"
              type: image
              url: https://openapi-generator.tech
            logo-dark:
              metadata: "{}"
              type: image
              url: https://openapi-generator.tech
          version:
            sequence: 0
            updated-at: ""
            created-at: ""
          status: active
      properties:
        id:
          $ref: "#/components/schemas/ContractId"
        info:
          $ref: "#/components/schemas/ContractInfo"
        config:
          $ref: "#/components/schemas/ContractConfig"
      required:
      - config
      - id
      - info
    ContractAmount:
      description: |-
        Pairing of a specific contract with a precise amount value.
        Used in **API responses** to provide complete amount information including
        both display value and raw precision data.
      example:
        amount:
          decimals: ""
          raw: ""
          value: ""
        contract-id:
          asset-unit: asset-unit
          network-id: network-id
      properties:
        contract-id:
          $ref: "#/components/schemas/ContractId"
        amount:
          $ref: "#/components/schemas/Amount"
      required:
      - amount
      - contract-id
    ContractAmountFormat:
      description: |-
        Pairing of a specific contract with a precise amount value.
        Used in **API requests** to accept amount data in flexible formats,
        allowing callers to provide either display value or raw precision data.
      example:
        amount:
          value: ""
        contract-id:
          asset-unit: asset-unit
          network-id: network-id
      properties:
        contract-id:
          $ref: "#/components/schemas/ContractId"
        amount:
          $ref: "#/components/schemas/AmountFormat"
      required:
      - amount
      - contract-id
    VaultId:
      description: Unique vault identifier.
      maxLength: 36
      minLength: 1
      pattern: "^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$"
      type: string
    VaultInfo:
      description: Vault lifecycle metadata.
      example:
        archived-at: ""
        version:
          sequence: 0
          updated-at: ""
          created-at: ""
      properties:
        archived-at:
          allOf:
          - $ref: "#/components/schemas/Timestamp"
          description: Timestamp of vault archival (null if active).
        version:
          $ref: "#/components/schemas/Version"
      required:
      - version
    VaultConfig:
      description: Vault configuration parameters.
      example:
        contract-ids:
        - asset-unit: asset-unit
          network-id: network-id
        - asset-unit: asset-unit
          network-id: network-id
        enabled: ""
      properties:
        contract-ids:
          description: Subscribed contracts (required for new vaults).
          items:
            $ref: "#/components/schemas/ContractId"
          type: array
        enabled:
          allOf:
          - $ref: "#/components/schemas/Enabled"
          description: "Vault activation status (default: true)."
    Vault:
      description: Financial operations container
      example:
        id: id
        config:
          contract-ids:
          - asset-unit: asset-unit
            network-id: network-id
          - asset-unit: asset-unit
            network-id: network-id
          enabled: ""
        info:
          archived-at: ""
          version:
            sequence: 0
            updated-at: ""
            created-at: ""
      properties:
        id:
          description: Unique vault identifier.
          maxLength: 36
          minLength: 1
          pattern: "^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$"
          type: string
        info:
          $ref: "#/components/schemas/VaultInfo"
        config:
          $ref: "#/components/schemas/VaultConfig"
      required:
      - config
      - id
      - info
    Document:
      description: Compliance document with validation lifecycle.
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        config:
          data:
            address:
              country: country
              postal-code: postal-code
              street: street
              region: region
            name: name
            birth:
              date: date
              country: country
              region: region
            id:
              number: number
              type: NationalIdentityCard
              issuer: issuer
            type: PersonNaturalV1
          type: PersonV1
        info:
          vault: vault
          status: ""
      properties:
        id:
          description: |-
            Universally unique identifier used for resources
            that require globally unique identification. Provides 128-bit uniqueness
            suitable for distributed systems and cross-system integration.
          format: uuid
          maxLength: 36
          minLength: 36
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
        info:
          $ref: "#/components/schemas/DocumentInfo"
        config:
          $ref: "#/components/schemas/DocumentConfig"
      required:
      - config
      - id
      - info
    DocumentId:
      $ref: "#/components/schemas/UUID"
    DocumentInfo:
      description: Document metadata and associations.
      example:
        vault: vault
        status: ""
      properties:
        vault:
          description: Unique vault identifier.
          maxLength: 36
          minLength: 1
          pattern: "^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$"
          type: string
        status:
          allOf:
          - $ref: "#/components/schemas/DocumentStatus"
          description: Current validation status.
      required:
      - status
      - vault
    DocumentType:
      description: Compliance document classification.
      enum:
      - PersonV1
      - CustodialV1
      - NonCustodialV1
      type: string
    DocumentConfig:
      description: |-
        Discriminated union of compliance-document content variants
        (Person V1, Custodial V1, Non-Custodial V1). The `type` field
        selects which variant's data shape applies.
      discriminator:
        mapping:
          PersonV1: "#/components/schemas/DocumentConfigPersonV1"
          CustodialV1: "#/components/schemas/DocumentConfigCustodialV1"
          NonCustodialV1: "#/components/schemas/DocumentConfigNonCustodialV1"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/DocumentConfigPersonV1"
      - $ref: "#/components/schemas/DocumentConfigCustodialV1"
      - $ref: "#/components/schemas/DocumentConfigNonCustodialV1"
    DocumentConfigBase:
      description: Document content specification.
      properties:
        type:
          $ref: "#/components/schemas/DocumentType"
      required:
      - type
    DocumentConfigPersonV1:
      allOf:
      - $ref: "#/components/schemas/DocumentConfigBase"
      - properties:
          data:
            $ref: "#/components/schemas/PersonV1"
        required:
        - data
      description: |-
        Document configuration carrying PersonV1 identity data (natural
        or legal person). `type` is fixed to "PersonV1".
      example:
        data:
          address:
            country: country
            postal-code: postal-code
            street: street
            region: region
          name: name
          birth:
            date: date
            country: country
            region: region
          id:
            number: number
            type: NationalIdentityCard
            issuer: issuer
          type: PersonNaturalV1
        type: PersonV1
    DocumentConfigCustodialV1:
      allOf:
      - $ref: "#/components/schemas/DocumentConfigBase"
      - properties:
          data:
            $ref: "#/components/schemas/CustodialV1"
        required:
        - data
      description: |-
        Document configuration carrying CustodialV1 data — declares a
        custodial relationship with a regulated provider holding the
        asset. `type` is fixed to "CustodialV1".
    DocumentConfigNonCustodialV1:
      allOf:
      - $ref: "#/components/schemas/DocumentConfigBase"
      - properties:
          data:
            $ref: "#/components/schemas/NonCustodialV1"
        required:
        - data
      description: |-
        Document configuration carrying NonCustodialV1 data — declares
        a self-custody arrangement bound to a wallet address. `type` is
        fixed to "NonCustodialV1".
    DocumentStatus:
      description: Document validation state.
      properties:
        id:
          $ref: "#/components/schemas/DocumentStatusId"
        details:
          description: Human-readable validation details.
          maxLength: 400
          minLength: 1
          type: string
        expire:
          $ref: "#/components/schemas/Expire"
      required:
      - details
      - id
    DocumentStatusId:
      description: Document validation status category.
      enum:
      - pending
      - expired
      - accepted
      - rejected
      - archived
      type: string
    DocumentStatusDetails:
      description: Human-readable validation details.
      maxLength: 400
      minLength: 1
      type: string
    PersonV1:
      description: |-
        Identity record discriminated between natural persons
        (PersonNaturalV1) and legal entities (PersonLegalV1). The V1
        of Definancy's compliance person model.
      discriminator:
        mapping:
          PersonNaturalV1: "#/components/schemas/PersonNaturalV1"
          PersonLegalV1: "#/components/schemas/PersonLegalV1"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/PersonNaturalV1"
      - $ref: "#/components/schemas/PersonLegalV1"
    PersonBase:
      description: Base identification document data common to both natural and legal
        persons.
      discriminator:
        mapping:
          PersonNaturalV1: "#/components/schemas/PersonNaturalV1"
          PersonLegalV1: "#/components/schemas/PersonLegalV1"
        propertyName: type
      properties:
        type:
          $ref: "#/components/schemas/PersonType"
        name:
          description: Full legal name of person/entity.
          maxLength: 800
          minLength: 1
          type: string
        address:
          $ref: "#/components/schemas/PersonAddress"
      required:
      - address
      - name
      - type
    PersonType:
      description: Person entity classification.
      enum:
      - PersonNaturalV1
      - PersonLegalV1
      type: string
    PersonName:
      description: Full legal name of person/entity.
      maxLength: 800
      minLength: 1
      type: string
    PersonAddress:
      description: |-
        Complete physical address information used for identity verification
        and compliance documentation. Includes all components necessary for
        address validation and geographic identification.
      example:
        country: country
        postal-code: postal-code
        street: street
        region: region
      properties:
        street:
          description: |-
            Complete street address including building number, street name, apartment
            or suite information. Used in compliance documents for physical address
            verification and identity confirmation processes.
          maxLength: 200
          minLength: 1
          type: string
        postal-code:
          description: |-
            Geographic postal or ZIP code for address verification. Format varies
            by country (e.g., 5-digit ZIP codes in US, alphanumeric postal codes
            in Canada). Used for compliance and identity verification.
          maxLength: 20
          minLength: 1
          type: string
        region:
          description: |-
            Administrative subdivision such as state, province, prefecture, or region.
            Used in address information for compliance documents and geographic
            identification in identity verification processes.
          maxLength: 40
          minLength: 1
          type: string
        country:
          description: |-
            Country name or ISO 3166-1 alpha-2 country code for geographic identification.
            Used in address information, birth records, and incorporation details
            for compliance and identity verification purposes.
          maxLength: 2
          minLength: 2
          type: string
      required:
      - country
      - postal-code
      - region
      - street
    PersonNaturalV1:
      allOf:
      - $ref: "#/components/schemas/PersonBase"
      - properties:
          id:
            $ref: "#/components/schemas/PersonNaturalId"
          birth:
            $ref: "#/components/schemas/PersonNaturalBirth"
        required:
        - birth
        - id
      description: Natural person (individual) details.
      example:
        address:
          country: country
          postal-code: postal-code
          street: street
          region: region
        name: name
        birth:
          date: date
          country: country
          region: region
        id:
          number: number
          type: NationalIdentityCard
          issuer: issuer
        type: PersonNaturalV1
    PersonNaturalId:
      description: |-
        Government-issued identification document details for individual
        identity verification including document number, type, and issuing authority.
      example:
        number: number
        type: NationalIdentityCard
        issuer: issuer
      properties:
        number:
          description: Identification document number.
          maxLength: 120
          minLength: 1
          type: string
        type:
          $ref: "#/components/schemas/PersonNaturalIdType"
        issuer:
          description: Identification issuing authority.
          maxLength: 40
          minLength: 1
          type: string
      required:
      - issuer
      - number
      - type
    PersonNaturalIdNumber:
      description: Identification document number.
      maxLength: 120
      minLength: 1
      type: string
    PersonNaturalIdType:
      description: Identification document type.
      enum:
      - NationalIdentityCard
      - Passport
      type: string
    PersonNaturalIdIssuer:
      description: Identification issuing authority.
      maxLength: 40
      minLength: 1
      type: string
    PersonNaturalBirth:
      description: Birth information.
      example:
        date: date
        country: country
        region: region
      properties:
        date:
          description: |-
            Calendar date in ISO 8601 format (YYYY-MM-DD) without time information.
            Used for birth dates, incorporation dates, and other date-only fields
            in compliance documentation and identity verification.
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[1-2][0-9]|3[0-1])$"
          type: string
        region:
          description: |-
            Administrative subdivision such as state, province, prefecture, or region.
            Used in address information for compliance documents and geographic
            identification in identity verification processes.
          maxLength: 40
          minLength: 1
          type: string
        country:
          description: |-
            Country name or ISO 3166-1 alpha-2 country code for geographic identification.
            Used in address information, birth records, and incorporation details
            for compliance and identity verification purposes.
          maxLength: 2
          minLength: 2
          type: string
      required:
      - country
      - date
      - region
    PersonLegalV1:
      allOf:
      - $ref: "#/components/schemas/PersonBase"
      - properties:
          id:
            $ref: "#/components/schemas/PersonLegalId"
          incorporation:
            $ref: "#/components/schemas/PersonLegalIncorporation"
        required:
        - id
        - incorporation
      description: Legal entity (organization) details.
